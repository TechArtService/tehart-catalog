name: Avito Catalog Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Sync catalog
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, json, requests

          auth = requests.post(
              "https://api.avito.ru/token/",
              data={
                  "grant_type": "client_credentials",
                  "client_id": os.environ["AVITO_CLIENT_ID"],
                  "client_secret": os.environ["AVITO_CLIENT_SECRET"],
              },
              timeout=30,
          )
          auth.raise_for_status()
          token = auth.json()["access_token"]
          headers = {"Authorization": f"Bearer {token}"}

          items = []
          page = 1
          while True:
              response = requests.get(
                  "https://api.avito.ru/core/v1/items",
                  headers=headers,
                  params={"per_page": 99, "page": page, "status": "active"},
                  timeout=30,
              )
              response.raise_for_status()
              batch = response.json().get("resources", [])
              if not batch:
                  break
              items.extend(batch)
              if len(batch) < 99:
                  break
              page += 1

          print("=== ПРОВЕРКА ДАННЫХ AVITO API ===")
          print("Всего объявлений:", len(items))
          if items:
              first = items[0]
              print("Поля первого объявления:", list(first.keys()))
              print("Данные первого объявления:")
              print(json.dumps(first, ensure_ascii=False, indent=2))
          print("=== КОНЕЦ ПРОВЕРКИ ===")
          print("Диагностический запуск завершён. Каталог не изменялся.")
          PY

      - name: Commit and push changes
        run: |
          echo "Диагностический запуск: изменений каталога нет."
