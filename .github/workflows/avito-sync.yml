name: Avito Catalog Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check detailed Avito item endpoint
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, json, requests

          auth = requests.post(
              "https://api.avito.ru/token/",
              data={
                  "grant_type": "client_credentials",
                  "client_id": os.environ["AVITO_CLIENT_ID"],
                  "client_secret": os.environ["AVITO_CLIENT_SECRET"],
              },
              timeout=30,
          )
          auth.raise_for_status()
          headers = {"Authorization": f"Bearer {auth.json()['access_token']}"}

          account = requests.get(
              "https://api.avito.ru/core/v1/accounts/self",
              headers=headers,
              timeout=30,
          )
          print("ACCOUNT HTTP:", account.status_code)
          account.raise_for_status()
          account_data = account.json()
          user_id = account_data.get("id")
          if not user_id:
              raise RuntimeError("В ответе accounts/self не найден id")

          item_id = 8576973955
          detail = requests.get(
              f"https://api.avito.ru/core/v1/accounts/{user_id}/items/{item_id}/",
              headers=headers,
              timeout=30,
          )
          print("DETAIL HTTP:", detail.status_code)
          print("DETAIL RESPONSE:")
          try:
              data = detail.json()
              print(json.dumps(data, ensure_ascii=False, indent=2))
              if isinstance(data, dict):
                  print("DETAIL FIELDS:", list(data.keys()))
          except ValueError:
              print(detail.text[:3000])
          detail.raise_for_status()
          print("Проверка завершена. Каталог не изменялся.")
          PY
