<style>
:root{color-scheme:dark;--bg:#111214;--panel:#1c1e21;--gold:#d7ad62;--muted:#a7a9ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font:15px Arial,sans-serif}
header{padding:30px 5%;background:linear-gradient(120deg,#242424,#111);border-bottom:1px solid #38332a}
.site-header {
  padding: 20px 5%;
  background: #111214;
  border-bottom: 1px solid #38332a;
  text-align: center;
}
.site-logo {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  margin: 0 auto;
}
main{max-width:1450px;margin:auto;padding:24px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:20px}
input,select{width:100%;padding:12px;background:var(--panel);color:white;border:1px solid #444;border-radius:7px}
.summary{color:var(--muted);margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid #303236;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.photo{height:220px;background:#101113;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain}.no-photo{color:var(--muted)}
.body{padding:15px;display:flex;flex-direction:column;gap:10px;flex:1}
h2{font-size:17px;line-height:1.35;margin:0}.price{font-size:22px;font-weight:bold;color:var(--gold)}
.specs{font-size:13px;line-height:1.7;color:#d2d2d2}.muted{color:var(--muted)}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: auto;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: auto;
}

.actions .btn {
  flex: 1 1 auto;
  min-width: 0;
  text-align: center;
  padding: 11px 10px;
  border: 1px solid #8e7040;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  background: #1c1e21;
  color: #f5f5f5;
  transition: background .2s, border-color .2s;
}

.actions .btn:hover {
  background: #34302a;
  border-color: #d7ad62;
}

.actions .btn:not(.secondary) {
  background: #d7ad62;
  color: #171717;
  border-color: #d7ad62;
}

.actions .btn:not(.secondary):hover {
  background: #e7c27e;
}

.actions a[href*="max.ru"] {
  background: #1c1e21;
  color: #f5f5f5;
  border-color: #d7ad62;
}
  min-width: 0;
  flex: 1 1 auto;
}

.actions a[href*="max.ru"] {
  background: #1c1e21;
  color: #fff;
}.actions a[href*="max.ru"] {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  min-width: 65px;
  background: #1c1e21 !important;
  color: #fff !important;
  position: relative;
  z-index: 2;
}.btn{flex:1;text-align:center;padding:11px 6px;border-radius:6px;text-decoration:none;font-weight:bold;background:var(--gold);color:#171717}
.btn.secondary{background:#303236;color:white}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:500px){main{padding:14px}.photo{height:190px}}
</style></head><body>

const $ = id => document.getElementById(id);
function clean(v){return String(v||'').trim()}
function fillSelect(id,key,label){
 const values=[...new Set(products.map(p=>clean(p[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
 values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=label?label(v):v;$ (id).appendChild(o)});
}
fillSelect('diameter','diameter',v=>'R'+v);
{
 const patterns = [...new Set(products
   .filter(p => clean(p.holes) && clean(p.pcd))
   .map(p => clean(p.holes) + 'x' + clean(p.pcd)))]
   .sort((a,b) => a.localeCompare(b,'ru',{numeric:true}));
 patterns.forEach(v => {
   const o = document.createElement('option');
   o.value = v;
   o.textContent = v.replace('x', '×');
   $('pcd').appendChild(o);
 });
}
fillSelect('width','width',v=>v+'"');
fillSelect('et','et',v=>'ET '+v);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){let n=Number(String(v).replace(/[^\d.,]/g,'').replace(',','.'));return n>0?n.toLocaleString('ru-RU')+' ₽':(v?esc(v):'Цена по запросу')}
function card(p){
 const specs=[
  p.diameter?'Диаметр: R'+p.diameter:'',
  p.width?'Ширина: '+p.width:'',
  p.pcd?'Сверловка: '+p.pcd:'',
  p.holes?'Количество отверстий: '+p.holes:'',
  p.et?'Вылет: ET '+p.et:'',
  p.dia?'DIA: '+p.dia:'',
 ].filter(Boolean).map(esc).join('<br>');

 const photo=p.photos?.length
  ?`<img loading="lazy" src="${esc(p.photos[0])}" alt="${esc(p.title)}" onerror="this.onerror=null;this.src='${esc(p.photos[1]||'')}';if(!this.src||this.src.endsWith('/'))this.parentElement.innerHTML='<span class=no-photo>Фото недоступно</span>'">`
  :'<span class="no-photo">Нет фото</span>';

 const shareUrl=window.location.origin+window.location.pathname+'#product-'+encodeURIComponent(p.id);
 const shareText=String(p.title||'Диск ТехАрт')+' — '+shareUrl;

 return `<article class="card" id="product-${encodeURIComponent(p.id)}">
  <div class="photo">${photo}</div>
  <div class="body">
   <h2>${esc(p.title)}</h2>
   <div class="price">${money(p.price)}</div>
   <div class="specs">${specs||'<span class=muted>Характеристики не указаны</span>'}</div>
   <div class="actions">
    ${p.url?`<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">На Авито</a>`:''}
    <a class="btn secondary" href="tel:+79692021112">Позвонить</a>
    <a class="btn secondary" href="https://t.me/TEXAPT" target="_blank" rel="noopener">Telegram</a>
    <a class="btn secondary" href="https://max.ru/u/f9LHodD0cOKkYI3dJJgM6xF9t7oEsk-4pNMxzrVsZAJHuUqazfsOMkepZ0U" target="_blank" rel="noopener">MAX</a>
    <button class="btn secondary" type="button" onclick="shareProduct(this)" data-url="${esc(shareUrl)}" data-title="${esc(p.title||'Диск ТехАрт')}">Поделиться</button>
   </div>
  </div>
 </article>`;
}

async function shareProduct(button){
 const url=button.dataset.url;
 const title=button.dataset.title||'Диск ТехАрт';

 if(navigator.share){
  try{
   await navigator.share({title:title,text:title,url:url});
   return;
  }catch(e){
   if(e.name==='AbortError')return;
  }
 }

 try{
  await navigator.clipboard.writeText(url);
  button.textContent='Ссылка скопирована!';
  setTimeout(()=>button.textContent='Поделиться',2000);
 }catch(e){
  prompt('Скопируйте ссылку:',url);
 }
}
function render(){
 const sharedId=location.hash.startsWith('#product-')
  ?decodeURIComponent(location.hash.slice('#product-'.length))
  :null;

 let list=products.filter(p=>{
  if(sharedId)return String(p.id)===sharedId;

  const q=$('search').value.toLowerCase();
  const hay=[p.title,p.brand,p.model,p.pcd,p.description,p.id].join(' ').toLowerCase();

  return (!q||hay.includes(q))&&
   (!$('diameter').value||clean(p.diameter)===$('diameter').value)&&
   (!$('pcd').value||(clean(p.holes)+'x'+clean(p.pcd))===$('pcd').value)&&
   (!$('width').value||clean(p.width)===$('width').value)&&
   (!$('et').value||clean(p.et)===$('et').value);
 });

 if($('sort').value!=='default')list.sort((a,b)=>{
  const price=p=>Number(String(p.price).replace(/[^\d]/g,''))||0;
  return $('sort').value==='asc'?price(a)-price(b):price(b)-price(a);
 });

 $('summary').textContent=sharedId
  ?(list.length?'Выбранный товар':'Товар не найден')
  :`Найдено: ${list.length} из ${products.length} объявлений`;

 $('grid').innerHTML=list.length
  ?list.map(card).join('')
  :'<div class="empty">Товар не найден.</div>';

 if(sharedId){
  const productCard=$('grid').querySelector('.card');
  if(productCard)productCard.scrollIntoView({block:'center'});
 }
}
['search','diameter','pcd','width','et','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
render();
