<html lang="ru"><head><meta charset="utf-8">

<title>ТехАрт — каталог дисков</title>
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#1c1e21;--gold:#d7ad62;--muted:#a7a9ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font:15px Arial,sans-serif}
header{padding:30px 5%;background:linear-gradient(120deg,#242424,#111);border-bottom:1px solid #38332a}
.site-header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 17px 5%;
  background: radial-gradient(ellipse at 18% 50%, rgba(215,173,98,.10), transparent 48%), linear-gradient(115deg, #202124 0%, #111214 68%);
  border-bottom: 1px solid rgba(215,173,98,.35);
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
  text-align: left;
}
.site-header::after {
  content: "";
  position: absolute;
  left: 5%;
  bottom: -1px;
  width: 92px;
  height: 2px;
  background: linear-gradient(90deg, #f0d69f, #b9873d);
}
.site-logo {
  display: block;
  width: 108px;
  max-width: 30%;
  height: auto;
  margin: 0;
  flex-shrink: 0;
  filter: drop-shadow(0 3px 8px rgba(215,173,98,.13));
}
.site-brand { min-width: 0; }
.site-brand-name {
  font-size: clamp(27px, 3vw, 36px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: #e5c17d;
  text-shadow: 0 2px 14px rgba(215,173,98,.16);
}
.site-brand-subtitle {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.4;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #b9b3a7;
}
@media (max-width: 500px) {
  .site-header { gap: 13px; padding: 13px 14px; }
  .site-logo { width: 76px; }
  .site-brand-name { font-size: 23px; letter-spacing: .07em; }
  .site-brand-subtitle { margin-top: 6px; font-size: 9px; letter-spacing: .11em; }
}
main{max-width:1450px;margin:auto;padding:24px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:20px}
.filter-group{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;border:1px solid #444;border-radius:8px;padding:12px;margin:0;min-width:0}
.filter-group legend{padding:0 7px;color:var(--gold);font-size:13px}
.filter-group[hidden],#filterControls[hidden]{display:none!important}
.category-switch{display:flex;gap:12px;margin:0 0 18px}
.category-btn{flex:1;min-height:52px;padding:12px 18px;border:1px solid #8e7040;border-radius:8px;background:#d7ad62;color:#171717;font-size:16px;font-weight:bold;cursor:pointer}
.category-btn:hover{background:#e7c27e}
.category-btn.active{background:#303236;color:#fff;border-color:#d7ad62}
input,select{width:100%;padding:12px;background:var(--panel);color:white;border:1px solid #444;border-radius:7px}
.summary{color:var(--muted);margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid #303236;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.photo{height:220px;background:#101113;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;transition:transform .2s ease}.photo img:hover{transform:scale(1.025)}.no-photo{color:var(--muted)}
.photo-viewer{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.88);backdrop-filter:blur(5px)}
.photo-viewer.open{display:flex}
.photo-viewer img{display:block;max-width:min(94vw,1400px);max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 12px 50px rgba(0,0,0,.5);cursor:zoom-out}
.photo-viewer-close{position:absolute;top:18px;right:22px;width:44px;height:44px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(30,30,30,.8);color:#fff;font-size:28px;line-height:1;cursor:pointer}
body.photo-viewer-open{overflow:hidden}
@media(max-width:600px){.photo-viewer{padding:12px}.photo-viewer img{max-width:96vw;max-height:86vh}.photo-viewer-close{top:10px;right:10px}}
.body{padding:15px;display:flex;flex-direction:column;gap:10px;flex:1}
h2{font-size:17px;line-height:1.35;margin:0}.price{font-size:22px;font-weight:bold;color:var(--gold)}
.specs{font-size:13px;line-height:1.7;color:#d2d2d2}.muted{color:var(--muted)}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: auto;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: auto;
}

.actions .btn {
  flex: 1 1 auto;
  min-width: 0;
  text-align: center;
  padding: 11px 10px;
  border: 1px solid #8e7040;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  background: #1c1e21;
  color: #f5f5f5;
  transition: background .2s, border-color .2s;
}

.actions .btn:hover {
  background: #34302a;
  border-color: #d7ad62;
}
.messenger-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.messenger-icon{width:21px;height:21px;display:block;flex:0 0 21px}
.telegram-btn .messenger-icon{color:#29a9e8}
.max-icon{border-radius:5px;object-fit:contain}
.actions .call-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: linear-gradient(135deg, #e8c47e, #c99a4d);
  color: #171717;
  border: 1px solid #f0d69f;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(215,173,98,.18);
  letter-spacing: .15px;
}
.actions .call-btn .call-icon {
  width: 19px;
  height: 19px;
  flex-basis: 19px;
}
.actions .call-btn:hover {
  background: linear-gradient(135deg, #f2d69d, #d9ad65);
  border-color: #f7e2b8;
  box-shadow: 0 5px 14px rgba(215,173,98,.3);
  transform: translateY(-1px);
}
.actions .call-btn:active { transform: translateY(0); }


.actions .btn:not(.secondary) {
  background: #d7ad62;
  color: #171717;
  border-color: #d7ad62;
}

.actions .btn:not(.secondary):hover {
  background: #e7c27e;
}

.btn{flex:1;text-align:center;padding:11px 6px;border-radius:6px;text-decoration:none;font-weight:bold;background:var(--gold);color:#171717}
.btn.secondary{background:#303236;color:white}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:500px){main{padding:14px}.photo{height:190px}}

<header class="site-header">

<main>

</div>

<select id="tireBrand"><option value="">Любой бренд</option></select>
<select id="tireWidth"><option value="">Любая ширина</option></select>
<select id="tireProfile"><option value="">Любой профиль</option></select>

</fieldset>
<select id="sort"><option value="default">По умолчанию</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select>
</div>
</div>
<div class="summary" id="summary"></div>
<div class="grid" id="grid"></div>
</main>
<div class="photo-viewer" id="photoViewer" aria-hidden="true" role="dialog" aria-label="Увеличенное фото товара">

 <img id="photoViewerImage" alt="">
</div>

 }
 const lower=source.toLowerCase();
 let season='';
 if(/всесезон|all.?season/.test(lower))season='Всесезонные';
 else if(/зимн|winter|шипован|нешипован/.test(lower))season='Зимние';
 else if(/летн|summer/.test(lower))season='Летние';
 return {sizes,season};
}
const tireProducts=products.filter(isTireProduct);
function fillValues(id,values,label){
 [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ru',{numeric:true})).forEach(v=>{
  const o=document.createElement('option');o.value=v;o.textContent=label?label(v):v;$(id).appendChild(o);
 });
}
fillSelect('diameter','diameter',v=>'R'+v);
{
 const patterns = [...new Set(products
   .filter(p => clean(p.holes) && clean(p.pcd))
   .map(p => clean(p.holes) + 'x' + clean(p.pcd)))]
   .sort((a,b) => a.localeCompare(b,'ru',{numeric:true}));
 patterns.forEach(v => {
   const o = document.createElement('option');
   o.value = v;
   o.textContent = v.replace('x', '×');
   $('pcd').appendChild(o);
 });
}
fillSelect('width','width',v=>v+'"');
fillSelect('et','et',v=>'ET '+v);
fillSelect('dia','dia',v=>'DIA '+v);
fillValues('tireBrand',tireProducts.map(p=>clean(p.brand)));
fillValues('tireWidth',tireProducts.flatMap(p=>tireInfo(p).sizes.map(x=>x.width)));
fillValues('tireProfile',tireProducts.flatMap(p=>tireInfo(p).sizes.map(x=>x.profile)));
fillValues('tireDiameter',tireProducts.flatMap(p=>tireInfo(p).sizes.map(x=>x.diameter)),v=>'R'+v);
function clearCategoryFilters(){
 ['diameter','pcd','width','et','dia','tireBrand','tireWidth','tireProfile','tireDiameter','tireSeason','search'].forEach(id=>$(id).value='');
}
function chooseCategory(type){
 clearCategoryFilters();
 $('productType').value=type;
 $('filterControls').hidden=false;
 $('wheelFilters').hidden=type!=='wheels';
 $('tireFilters').hidden=type!=='tires';
 $('showTires').classList.toggle('active',type==='tires');
 $('showWheels').classList.toggle('active',type==='wheels');
 updateFacetOptions();
 render();
}
$('showTires').addEventListener('click',()=>chooseCategory('tires'));
$('showWheels').addEventListener('click',()=>chooseCategory('wheels'));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){let n=Number(String(v).replace(/[^\d.,]/g,'').replace(',','.'));return n>0?n.toLocaleString('ru-RU')+' ₽':(v?esc(v):'Цена по запросу')}
function card(p){
 const specs=[
  p.diameter?'Диаметр: R'+p.diameter:'',
  p.width?'Ширина: '+p.width:'',
  p.pcd?'Сверловка: '+p.pcd:'',
  p.holes?'Количество отверстий: '+p.holes:'',
  p.et?'Вылет: ET '+p.et:'',
  p.dia?'DIA: '+p.dia:'',
 ].filter(Boolean).map(esc).join('<br>');

 const photo=p.photos?.length
  ?`<img loading="lazy" decoding="async" referrerpolicy="no-referrer" data-photos="${esc(JSON.stringify(p.photos))}" data-photo-index="0" src="${esc(p.photos[0])}" alt="${esc(p.title)}" onerror="nextPhoto(this)">`
  :'<span class="no-photo">Нет фото</span>';

 const shareUrl=window.location.origin+window.location.pathname+'#product-'+encodeURIComponent(p.id);
const shareText=String(p.title||'Диск ТехАрт')+' — '+shareUrl;

 return `<article class="card" id="product-${encodeURIComponent(p.id)}">
  <div class="photo">${photo}</div>
  <div class="body">
   <h2>${esc(p.title)}</h2>
   <div class="price">${money(p.price)}</div>
   <div class="specs">${specs||'<span class=muted>Характеристики не указаны</span>'}</div>
   <div class="actions">
    ${p.url?`<a class="btn secondary" href="${esc(p.url)}" target="_blank" rel="noopener">На Авито</a>`:''}
    <button class="btn secondary" type="button" onclick="shareProduct(this)" data-url="${esc(shareUrl)}" data-title="${esc(p.title||'Диск ТехАрт')}">Поделиться</button>
    <a class="btn secondary messenger-btn telegram-btn" href="https://t.me/TEXAPT" target="_blank" rel="noopener" aria-label="Написать в Telegram">
     <svg class="messenger-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.7 4.35 18.6 19c-.23 1.04-.84 1.3-1.7.81l-4.7-3.47-2.27 2.18c-.25.25-.46.46-.94.46l.34-4.79 8.72-7.88c.38-.34-.08-.53-.59-.19L6.68 13.1 2.06 11.65c-1-.31-1.02-1 .21-1.48L20.33 3.1c.83-.3 1.56.2 1.37 1.25Z"/></svg>
     <span>Telegram</span>
    </a>
    <a class="btn secondary messenger-btn max-btn" href="https://max.ru/u/f9LHodD0cOKkYI3dJJgM6xF9t7oEsk-4pNMxzrVsZAJHuUqazfsOMkepZ0U" target="_blank" rel="noopener" aria-label="Написать в MAX">
     <img class="messenger-icon max-icon" src="https://max.ru/s/img/big-logo.png" alt="">
     <span>MAX</span>
    </a>
    <a class="btn call-btn" href="tel:+79692021112"><svg class="messenger-icon call-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.56 3.57.56a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.24.19 2.45.56 3.57a1 1 0 01-.25 1.02l-2.19 2.2z"/></svg><span>Позвонить</span></a>
   </div>
  </div>

const photoViewer=$('photoViewer');
const photoViewerImage=$('photoViewerImage');
function closePhotoViewer(){
 photoViewer.classList.remove('open');
 photoViewer.setAttribute('aria-hidden','true');
 photoViewerImage.removeAttribute('src');
 document.body.classList.remove('photo-viewer-open');
}
$('grid').addEventListener('click',event=>{
 const img=event.target.closest('.photo img');
 if(!img)return;
 photoViewerImage.src=img.currentSrc||img.src;
 photoViewerImage.alt=img.alt||'Фото товара';
 photoViewer.classList.add('open');
 photoViewer.setAttribute('aria-hidden','false');
 document.body.classList.add('photo-viewer-open');
});
photoViewer.addEventListener('click',event=>{
 if(event.target===photoViewer||event.target===photoViewerImage||event.target.closest('.photo-viewer-close'))closePhotoViewer();
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&photoViewer.classList.contains('open'))closePhotoViewer();
});

function nextPhoto(img){
 let urls=[];
 try{urls=JSON.parse(img.dataset.photos||"[]")}catch{}
 const next=Number(img.dataset.photoIndex||0)+1;
 if(next>=urls.length){
  img.onerror=null;
  img.parentElement.innerHTML='<span class="no-photo">Фото временно недоступно</span>';
  return;
 }
 img.dataset.photoIndex=String(next);
 setTimeout(()=>{img.src=urls[next]},700);
}

async function shareProduct(button){
 const url=button.dataset.url;

 try{
  await navigator.clipboard.writeText(url);
  button.textContent='Ссылка скопирована!';
  setTimeout(()=>button.textContent='Поделиться',2000);
 }catch(e){
  prompt('Скопируйте ссылку:',url);
 }
}
  
function showSharedProduct(){
 const match=location.hash.match(/^#product-(.+)$/);
 if(!match)return;

 const id=decodeURIComponent(match[1]);
 const product=products.find(p=>String(p.id)===id);
 if(!product)return;

 $('grid').innerHTML=card(product);
 $('summary').textContent='Выбранный товар';
}

  function render(){
 const type=$('productType').value;
 const wheelFiltersActive=['diameter','pcd','width','et','dia'].some(id=>Boolean($(id).value));
 const tireFiltersActive=['tireBrand','tireWidth','tireProfile','tireDiameter','tireSeason'].some(id=>Boolean($(id).value));
 let list=products.filter(p=>{
  if(p.status==='inactive')return false;
  const q=$('search').value.toLowerCase();
  const hay=[p.title,p.brand,p.model,p.pcd,p.description,p.id].join(' ').toLowerCase();
  const tire=isTireProduct(p);
  if(type==='tires'&&!tire)return false;
  if(type==='wheels'&&tire)return false;
  // В режиме «Все товары» активные фильтры одной категории не должны пропускать товары другой категории.
  if(type==='all'&&tire&&wheelFiltersActive)return false;
  if(type==='all'&&!tire&&tireFiltersActive)return false;
  if(q&&!hay.includes(q))return false;
  if(!tire){
   if($('diameter').value&&clean(p.diameter)!==$('diameter').value)return false;
   if($('pcd').value&&(clean(p.holes)+'x'+clean(p.pcd))!==$('pcd').value)return false;
   if($('width').value&&clean(p.width)!==$('width').value)return false;
   if($('et').value&&clean(p.et)!==$('et').value)return false;
   if($('dia').value&&clean(p.dia)!==$('dia').value)return false;
  }else{
   const info=tireInfo(p);
   const matches=info.sizes.filter(size=>
    (!$('tireWidth').value||size.width===$('tireWidth').value)&&
    (!$('tireProfile').value||size.profile===$('tireProfile').value)&&
    (!$('tireDiameter').value||size.diameter===$('tireDiameter').value)
   );
   if(($('tireWidth').value||$('tireProfile').value||$('tireDiameter').value)&&!matches.length)return false;
   if($('tireBrand').value&&clean(p.brand)!==$('tireBrand').value)return false;
   if($('tireSeason').value&&(info.season||'Не указано')!==$('tireSeason').value)return false;
  }
  return true;
 });

 if($('sort').value!=='default')list.sort((a,b)=>{
  const price=p=>Number(String(p.price).replace(/[^\d]/g,''))||0;
  return $('sort').value==='asc'?price(a)-price(b):price(b)-price(a);
 });

 $('summary').textContent=`Найдено: ${list.length} из ${products.length} объявлений`;
 $('grid').innerHTML=list.length
  ?list.map(card).join('')
  :'<div class="empty">Ничего не найдено. Измени параметры поиска.</div>';
}
function refreshFacet(id,values,label){
 const select=$(id), selected=select.value, first=select.options[0].cloneNode(true);
 select.replaceChildren(first);
 [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ru',{numeric:true})).forEach(value=>{
  const option=document.createElement('option');
  option.value=value;
  option.textContent=label?label(value):value;
  select.appendChild(option);
 });
 select.value=values.includes(selected)?selected:'';
}
function updateFacetOptions(){
 const type=$('productType').value;
 const query=$('search').value.toLowerCase();
 const wheels=products.filter(p=>!isTireProduct(p)&&type!=='tires'&&
  (!query||[p.title,p.brand,p.model,p.pcd,p.description,p.id].join(' ').toLowerCase().includes(query)));
 const wheelKeys=['diameter','pcd','width','et','dia'];
 const wheelAvailable=(p,skip)=>wheelKeys.every(key=>{
  if(key===skip||!$(key).value)return true;
  if(key==='pcd')return (clean(p.holes)+'x'+clean(p.pcd))===$('pcd').value;
  return clean(p[key])===$(key).value;
 });
 refreshFacet('diameter',wheels.filter(p=>wheelAvailable(p,'diameter')).map(p=>clean(p.diameter)),v=>'R'+v);
 refreshFacet('pcd',wheels.filter(p=>wheelAvailable(p,'pcd')&&clean(p.holes)&&clean(p.pcd)).map(p=>clean(p.holes)+'x'+clean(p.pcd)),v=>v.replace('x','×'));
 refreshFacet('width',wheels.filter(p=>wheelAvailable(p,'width')).map(p=>clean(p.width)),v=>v+'″');
 refreshFacet('et',wheels.filter(p=>wheelAvailable(p,'et')).map(p=>clean(p.et)),v=>'ET '+v);
 refreshFacet('dia',wheels.filter(p=>wheelAvailable(p,'dia')).map(p=>clean(p.dia)),v=>'DIA '+v);

 const tires=tireProducts.filter(p=>type!=='wheels'&&
  (!query||[p.title,p.brand,p.model,p.description,p.id].join(' ').toLowerCase().includes(query)));
 const sizeKeys=['tireWidth','tireProfile','tireDiameter'];
 const tireSizes=(p,skip)=>tireInfo(p).sizes.filter(size=>
  sizeKeys.every(key=>key===skip||!$(key).value||
   size[key==='tireWidth'?'width':key==='tireProfile'?'profile':'diameter']===$(key).value)
 );
 const tireAvailable=(p,skip)=>tireSizes(p,skip).length>0&&
  (!skip||skip==='tireBrand'||!$('tireBrand').value||clean(p.brand)===$('tireBrand').value)&&
  (!skip||skip==='tireSeason'||!$('tireSeason').value||
   (tireInfo(p).season||'Не указано')===$('tireSeason').value);
 refreshFacet('tireBrand',tires.filter(p=>tireAvailable(p,'tireBrand')).map(p=>clean(p.brand)));
 refreshFacet('tireWidth',tires.filter(p=>tireAvailable(p,'tireWidth')).flatMap(p=>tireSizes(p,'tireWidth').map(x=>x.width)));
 refreshFacet('tireProfile',tires.filter(p=>tireAvailable(p,'tireProfile')).flatMap(p=>tireSizes(p,'tireProfile').map(x=>x.profile)));
 refreshFacet('tireDiameter',tires.filter(p=>tireAvailable(p,'tireDiameter')).flatMap(p=>tireSizes(p,'tireDiameter').map(x=>x.diameter)),v=>'R'+v);
 refreshFacet('tireSeason',tires.filter(p=>tireAvailable(p,'tireSeason')).map(p=>tireInfo(p).season||'Не указано'));
}
['search','diameter','pcd','width','et','dia','tireBrand','tireWidth','tireProfile','tireDiameter','tireSeason'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{
 updateFacetOptions();
 render();
}));
$('sort').addEventListener('change',render);
$('resetFilters').addEventListener('click',()=>{clearCategoryFilters();$('sort').value='default';updateFacetOptions();render();});
chooseCategory('wheels');
showSharedProduct();
</script></body></html>
